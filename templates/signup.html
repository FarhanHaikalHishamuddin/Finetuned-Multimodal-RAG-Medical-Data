<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedRAG | Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0d1117; --accent: #00d2ff; --card: #161b22; --text: #e6edf3; }
        body { 
            font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text);
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
        }
        .signup-card {
            background: var(--card); padding: 2.5rem; border-radius: 16px;
            width: 100%; max-width: 400px; border: 1px solid #30363d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: var(--accent); margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #8b949e; }
        input, select {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #30363d;
            background: #0d1117; color: white; box-sizing: border-box;
        }
        .btn-signup {
            width: 100%; padding: 12px; border-radius: 8px; border: none;
            background: var(--accent); color: #000; font-weight: 600; cursor: pointer;
            margin-top: 1rem; transition: 0.3s;
        }
        .btn-signup:hover { opacity: 0.9; transform: translateY(-2px); }
        .footer-link { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; }
        .footer-link a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <div class="signup-card">
        <h2>Create MedRAG ID</h2>
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter clinical ID" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>User Role</label>
                <select name="role">
                    <option value="normal">Normal User (Access Only)</option>
                    <option value="expert">Medical Expert (Train/Reinforce)</option>
                </select>
            </div>
            <button type="submit" class="btn-signup">Register Account</button>
        </form>
        <div class="footer-link">
            Already have an account? <a href="/login">Sign In</a>
        </div>
    </div>
</body>
</html>
